name: Build APK

# 用途：云端构建 debug APK。
# - 推送 v* 标签（如 v0.2.0）自动构建并发布到 Release，供安卓直接下载；
# - 也可在 Actions 页手动触发（workflow_dispatch），产物为构建附件。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  releases: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/SkipStart-v${VERSION}-debug.apk"
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skipstart-debug-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkipStart v${{ env.APK_VERSION }}
          files: release/*.apk
          body: |
            ## SkipStart v${{ env.APK_VERSION }}

            开屏广告自动跳过助手（Android 8.0+）。下载下方 APK 直接安装即可。

            ### 本版重点
            - 学习模式重做：三步引导、应用列表选择、自动拉起目标 App、60 秒倒计时
            - 学习效果提升：四级取样、多条候选规则 + 推荐度、保存前可试跑
            - 无障碍权限机型适配：三级状态判定、三态首页、分品牌设置路径

            完整说明见仓库 README 与 docs/USER_GUIDE.md。

            > 首次安装需允许「安装未知应用」；本应用无网络权限，全部数据仅存本机。
